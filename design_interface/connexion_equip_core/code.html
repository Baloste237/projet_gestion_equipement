<style>
        body {
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
        }
        .glass-card {
            background-color: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>

<body class="flex items-center justify-center p-4 antialiased text-on-surface">
<div class="glass-card w-full max-w-md rounded-xl border border-outline-variant p-margin shadow-2xl relative overflow-hidden">
<!-- Background subtle glow -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-primary rounded-full opacity-5 blur-[100px] pointer-events-none"></div>
<div class="absolute -bottom-32 -left-32 w-64 h-64 bg-tertiary rounded-full opacity-5 blur-[100px] pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center mb-lg">
<div class="w-16 h-16 rounded-lg bg-surface-container-high border border-outline-variant flex items-center justify-center mb-sm shadow-md">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="deployed_code" style="font-variation-settings: 'FILL' 1;">deployed_code</span>
</div>
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg text-on-surface text-center tracking-tight">EQUIP-CORE</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Secure Enterprise Access</p>
</div>
<form class="flex flex-col gap-md relative z-10">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Corporate Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-opacity-50">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-sm pl-10 pr-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline placeholder:text-opacity-30" id="email" placeholder="admin@enterprise.local" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Recover Access</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-opacity-50">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-sm pl-10 pr-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline placeholder:text-opacity-30" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-2 mt-xs">
<input class="w-4 h-4 rounded bg-surface-container-lowest border-outline-variant text-primary focus:ring-primary focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Persist session</label>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md rounded-lg py-sm mt-sm shadow-[0_0_15px_rgba(77,142,255,0.15)] hover:shadow-[0_0_25px_rgba(77,142,255,0.25)] hover:bg-primary-fixed transition-all duration-200 active:scale-[0.98] uppercase tracking-widest flex items-center justify-center gap-2" type="submit">
                Authenticate
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="relative z-10 mt-margin mb-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-[#1a1a1a] px-3 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Or integrate via</span>
</div>
</div>
<div class="flex flex-col gap-sm relative z-10">
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low border border-outline-variant rounded-lg py-sm font-label-md text-label-md text-on-surface hover:bg-surface-variant transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
                Google Workspace
            </button>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low border border-outline-variant rounded-lg py-sm font-label-md text-label-md text-on-surface hover:bg-surface-variant transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">business</span>
                Azure Active Directory
            </button>
</div>
<div class="mt-margin text-center relative z-10">
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-60">System build v4.2.1 • Security Protocol Alpha</p>
</div>
</div>
