name: Microservices CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  services:
    name: Build & Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - equipment-service
          - assignment-service
          - inventory-service
          - audit-service

    # Base jetable pour les tests d'intégration d'auth-service (comptes, dernier administrateur, concurrence)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Generate Prisma Client
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npx prisma generate

      - name: TypeScript compilation
        working-directory: services/${{ matrix.service }}
        run: npx tsc --noEmit -p tsconfig.json

      - name: Appliquer les migrations sur la base de test (auth-service)
        if: matrix.service == 'auth-service'
        working-directory: services/auth-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
        run: npx prisma migrate deploy

      - name: Unit & HTTP tests (sécurité comprise)
        working-directory: services/${{ matrix.service }}
        env:
          TEST_DATABASE_URL: ${{ matrix.service == 'auth-service' && 'postgresql://postgres:postgres@localhost:5432/auth_test' || '' }}
        run: npm test

  gateway:
    name: Build & Test gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        working-directory: gateway
        run: npm ci

      - name: TypeScript compilation
        working-directory: gateway
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        working-directory: gateway
        run: npm test
