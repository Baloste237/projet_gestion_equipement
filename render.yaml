services:
  - type: web
    name: equip-core-backend
    env: docker
    dockerfilePath: Dockerfile.render
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: equip-core-db
          property: connectionString

databases:
  - name: equip-core-db
    databaseName: equip_core_db
    user: postgres
    plan: free
    region: frankfurt
